# AI code review on pull requests (software factory, Phase 1).
# Runs on Nick's Claude subscription through the CLAUDE_CODE_OAUTH_TOKEN secret.
# To save usage it reviews when a PR opens or leaves draft, not on every push.
# Add the "ai-review" label to a PR to ask for another review after changes.
name: Claude code review
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for the Safe Streets Halton dashboard,
            a Next.js app (run through vinext on Cloudflare Workers) that maps
            Halton police incident data. Read CLAUDE.md and AGENTS.md for the
            project's conventions before reviewing.

            Steps:
            1. Read the PR with `gh pr view` and the diff with `gh pr diff`.
            2. If the PR body says "Closes #N" (or Fixes/Resolves), read that issue
               with `gh issue view N --comments`. Its spec is what the PR should do.
            3. Review the change on two axes:
               - Spec: does it do what the issue asked, and nothing it shouldn't?
               - Standards: correctness bugs, security (especially database queries
                 and server actions), accessibility, missing tests, and the
                 conventions in CLAUDE.md and AGENTS.md.
            4. Post an inline comment on the exact line for each specific problem.
               Only comment on real problems, not style nits a linter would catch.
            5. Post one summary comment with `gh pr comment`, in this shape:

               ## Claude review
               **What this PR does:** two or three plain sentences.
               **Verdict:** Looks good / Needs changes / Needs a closer human look
               **Matches the issue:** yes, partly or no, with one line why (or
               "No linked issue").
               **Findings:** a short list, most important first, each marked
               Blocking, Should fix or Nit. Write "None" if there are none.
               **Check on the preview:** what to click through on the Cloudflare
               preview, or "Nothing visible" for non-UI changes.

            Write in plain, friendly Canadian English. Keep the summary short:
            the reader skims it. Do not approve or merge the PR, and do not push
            commits.
