# Opens bug issues for new errors on the live dashboard (software factory, Phase 4).
# Runs once a day and needs no AI, so it costs nothing from the Claude plan.
# See .github/scripts/cloudflare-errors.sh for what it posts and how.
#
# Needs two repo secrets, added by Nick:
#   CLOUDFLARE_OBSERVABILITY_TOKEN  an API token with only "Workers Observability: Read"
#   CLOUDFLARE_ACCOUNT_ID           the account the Worker runs in
name: Cloudflare errors
on:
  schedule:
    # 11:00 UTC is 6 AM in Toronto (7 AM in summer).
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: How many hours back to look for errors
        default: "26"

permissions:
  issues: write

concurrency:
  group: cloudflare-errors

jobs:
  errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVICE: safe-streets-halton-dashboard
      LOOKBACK_HOURS: ${{ inputs.lookback_hours || '26' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::notice::Skipped: add the CLOUDFLARE_OBSERVABILITY_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to turn this on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Turn new errors into issues
        if: steps.secrets.outputs.ready == 'true'
        run: .github/scripts/cloudflare-errors.sh
