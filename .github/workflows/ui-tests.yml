name: UI Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
  pull-requests: read

jobs:
  # "UI Tests / test" is a required check, so this workflow must always trigger
  # (no `paths:` filter, which would leave the check pending forever). Instead
  # `changes` decides whether UI-related files changed, and `test` is skipped
  # when they didn't. A skipped job counts as passing for required checks.
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.detect.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for UI-related changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Paths that can change what the UI tests see. Keep in sync with the app layout.
          UI_PATHS='^(src/|e2e/|public/|\.storybook/|\.github/workflows/ui-tests\.yml$|(playwright|vitest|vite|vite\.cloudflare|drizzle|cloudflare)\.config\.ts$|next\.config\.mjs$|postcss\.config\.cjs$|components\.json$|envConfig\.ts$|tsconfig\.json$|package\.json$|package-lock\.json$|\.env\.schema$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          if [ -n "$PR_NUMBER" ]; then
            files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          else
            files=$(git diff --name-only HEAD~1 HEAD) || files=""
          fi
          if [ -z "$files" ]; then
            echo "Could not list changed files; running the UI tests to be safe."
            echo "ui=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -Eq "$UI_PATHS"; then
            echo "UI-related files changed; running the UI tests."
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "No UI-related files changed; skipping the UI tests."
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # CI only installs Chromium, so only run the Chromium project.
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium
      - name: Build Storybook
        run: pnpm run build-storybook --quiet
      - name: Run storybook tests
        run: pnpm run test-storybook --browser.name=chromium
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
