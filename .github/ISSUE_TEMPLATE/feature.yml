name: Feature or change
description: Something new or different for the dashboard.
labels: [enhancement, needs-triage]
body:
  - type: input
    id: story
    attributes:
      label: User story
      description: The SSHD story this belongs to, if there is one.
      placeholder: SSHD-12
  - type: textarea
    id: what
    attributes:
      label: What should change, and why?
      description: Describe it from the point of view of someone using the dashboard.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How will we know it works?
      description: What you'd check on the preview before calling it done.
      placeholder: |
        - On the map, ...
        - Filtering by ward shows ...
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, links, data sources or open questions.
