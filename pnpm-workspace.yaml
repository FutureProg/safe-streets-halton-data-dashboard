allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: true
  es5-ext: false
  esbuild: true
  protobufjs: true
  sharp: false
  ssh2: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - drizzle-orm@0.45.2
  - uuid@11.1.1
  - image-size@2.0.3
  - maplibre-gl@6.4.1
  - "@vitest/mocker@4.1.11"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
  "@vitest/browser-playwright": 5.0.3
  "@vitest/coverage-v8": 5.0.3
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  varlock:
    skills: true
