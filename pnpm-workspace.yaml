allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  cpu-features: true
  es5-ext: false
  esbuild: true
  protobufjs: true
  sharp: false
  ssh2: true
  unrs-resolver: false
  workerd: false
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - drizzle-orm@0.45.2
  - uuid@11.1.1
  - image-size@2.0.3
  - maplibre-gl@6.4.1
  - "@vitest/mocker@4.1.11"
  - vinext@1.4.1
  - "@vinext/cloudflare@1.3.1"
  - "@vitejs/plugin-react@6.2.1"
  - cf@1.0.0-beta.27
  - "@cloudflare/vite-plugin@2.0.0-beta.v.10"
  - "@cloudflare/config@0.29.1"
  - "@cloudflare/config@0.30.0"
  - "@cloudflare/build-output-utils@0.9.7"
  - "@cloudflare/build-output-utils@0.9.8"
  - "@cloudflare/runtime-types@0.1.20"
  - "@cloudflare/runtime-types@0.1.21"
  - miniflare@5.20261101.0-beta
  - miniflare@5.20261102.0-beta
  - workerd@1.20261102.1
  - "@cloudflare/workerd-darwin-64@1.20261102.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261102.1"
  - "@cloudflare/workerd-linux-64@1.20261102.1"
  - "@cloudflare/workerd-linux-arm64@1.20261102.1"
  - "@cloudflare/workerd-windows-64@1.20261102.1"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vitest/coverage-istanbul": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  varlock:
    skills: true
